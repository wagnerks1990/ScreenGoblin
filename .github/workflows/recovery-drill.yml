name: Recovery drill

on:
  pull_request:
    paths:
      - ".github/workflows/recovery-drill.yml"
      - "deploy/scripts/**"
      - "deploy/docker/**"
      - "docs/RUNBOOK.md"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Exercise PostgreSQL, object, and image recovery
        run: deploy/scripts/validate-recovery.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('recovery-evidence/**') != ''
        with:
          name: recovery-drill-evidence-${{ github.sha }}
          path: recovery-evidence
          if-no-files-found: error
          retention-days: 14
