name: Recovery drill

on:
  pull_request:
    paths:
      - ".github/workflows/recovery-drill.yml"
      - "package-lock.json"
      - "apps/api/prisma/**"
      - "deploy/scripts/**"
      - "deploy/docker/**"
      - "docs/RELEASE_EVIDENCE.md"
      - "docs/RUNBOOK.md"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise migrated application, object, and image recovery
        env:
          RECOVERY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deploy/scripts/validate-recovery.sh
      - name: Report disposable recovery measurements
        run: cat recovery-evidence/measurements.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('recovery-evidence/**') != ''
        with:
          name: recovery-drill-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-evidence
          if-no-files-found: error
          retention-days: 14
