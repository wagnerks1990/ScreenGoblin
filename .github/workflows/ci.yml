name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: screengoblin_test
          POSTGRES_USER: screengoblin
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U screengoblin -d screengoblin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://screengoblin:test-only-password@127.0.0.1:5432/screengoblin_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      PAIRING_CODE_PEPPER: ci-only-pairing-pepper-at-least-32-characters
      MANIFEST_SIGNING_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SCREEN_GOBLIN_ALLOW_TEST_DATABASE_RESET: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm run validate:container-inputs
      - run: npm ci
      - run: npm run prisma:generate -w @screengoblin/api
      - run: npm run prisma:migrate -w @screengoblin/api
      - name: Emit canonical request ID test formatting
        run: |
          npx prettier --write apps/api/test/api.test.ts
          git diff -- apps/api/test/api.test.ts
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Test PrismaStore against PostgreSQL
        run: npm run test:integration:postgres
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-builds
          path: |
            apps/console/dist
            apps/player/dist
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: screengoblin_e2e
          POSTGRES_USER: screengoblin
          POSTGRES_PASSWORD: e2e-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U screengoblin -d screengoblin_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://screengoblin:e2e-test-only-password@127.0.0.1:5432/screengoblin_e2e?schema=public
      JWT_SECRET: e2e-only-jwt-secret-at-least-32-characters
      PAIRING_CODE_PEPPER: e2e-only-pairing-pepper-at-least-32-characters
      MANIFEST_SIGNING_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      PUBLIC_API_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:4173
      MEDIA_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DEVICE_AUTH_MODE: development-bearer
      EMERGENCY_FEATURE_ENABLED: "false"
      LOG_LEVEL: warn
      VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1
      SEED_ADMIN_EMAIL: owner.e2e@example.test
      SEED_ADMIN_PASSWORD: e2e-only-owner-password
      SEED_ADMIN_NAME: E2E Owner
      SEED_ORGANIZATION_NAME: ScreenGoblin E2E
      SEED_ORGANIZATION_SLUG: screengoblin-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm run validate:container-inputs
      - run: npm ci
      - name: Install pinned Chromium browser revision
        run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate -w @screengoblin/api
      - run: npm run prisma:migrate -w @screengoblin/api
      - run: npm run prisma:seed -w @screengoblin/api
      - run: npm run build -w @screengoblin/api
      - run: npm run build -w @screengoblin/console
      - run: npm run test:e2e:console

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: npm ci
      - run: npm run android:sync -w @screengoblin/player
      - name: Validate and build debug APK
        working-directory: apps/player/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict \
            lint test assembleDebug assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-debug-apk
          path: apps/player/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: web-api
    env:
      SCREEN_GOBLIN_HOST: signage.example.test
      PLAYER_HOST: player.example.test
      ACME_EMAIL: ops@example.test
      POSTGRES_DB: screengoblin
      POSTGRES_USER: screengoblin
      POSTGRES_PASSWORD: ci-compose-password
      DATABASE_URL: postgresql://screengoblin:ci-compose-password@postgres:5432/screengoblin?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      PAIRING_CODE_PEPPER: ci-only-pairing-pepper-at-least-32-characters
      MANIFEST_SIGNING_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      S3_ACCESS_KEY_ID: ci-api
      S3_SECRET_ACCESS_KEY: ci-only-api-storage-password
      S3_PUBLIC_BASE_URL: https://signage.example.test/media
      SEED_ADMIN_EMAIL: admin@screengoblin.example.test
      SEED_ADMIN_PASSWORD: ci-only-seed-password
      SEED_ADMIN_NAME: CI Administrator
      SEED_ORGANIZATION_NAME: ScreenGoblin CI
      SEED_ORGANIZATION_SLUG: screengoblin-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose build api console player-web
      - name: Exercise the production-mode Compose runtime
        env:
          COMPOSE_SMOKE_EVIDENCE_DIR: compose-smoke-evidence
        run: deploy/scripts/validate-compose-runtime.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('compose-smoke-evidence/**') != ''
        with:
          name: compose-smoke-evidence-${{ github.sha }}
          path: compose-smoke-evidence
          if-no-files-found: error
          retention-days: 7
