name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'java-kotlin'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Prepare Android dependencies
        if: matrix.language == 'java-kotlin'
        run: |
          npm ci
          npm run android:sync -w @screengoblin/player
      - name: Trace Android Java compilation
        if: matrix.language == 'java-kotlin'
        working-directory: apps/player/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict \
            :app:compileDebugJavaWithJavac
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: never
      - name: Block CodeQL findings
        shell: bash
        run: bash deploy/scripts/block-codeql-findings.sh codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('codeql-results/**/*.sarif') != ''
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
